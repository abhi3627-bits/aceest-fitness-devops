{% extends "base.html" %}

{% block title %}ACEest Login{% endblock %}

{% block content %}

<div class="card" style="max-width: 450px; margin: 80px auto;">

    <h1>ACEest Login</h1>

    <form method="POST">

        <label>Username</label>
        <input
            type="text"
            name="username"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p style="margin-top:20px;">
        Default login: <strong>admin / admin</strong>
    </p>

</div>

{% endblock %}
