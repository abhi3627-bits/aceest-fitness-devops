<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ACEest Fitness & Performance{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
        }

        nav {
            background: #d4af37;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: black;
            text-decoration: none;
            font-weight: bold;
            margin-left: 20px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .card {
            background: #292929;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        h1, h2 {
            color: #d4af37;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 6px 0 15px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 5px;
        }

        button {
            background: #d4af37;
            color: black;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #f0c94a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #555;
            text-align: left;
        }

        th {
            color: #d4af37;
        }

        .alert {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
            background: #333;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .stat {
            background: #292929;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 35px;
            color: #d4af37;
            font-weight: bold;
        }
    </style>
</head>

<body>

{% if session.get("username") %}

<nav>
    <div>
        <strong>ACEest Fitness & Performance</strong>
    </div>

    <div>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('clients') }}">Clients</a>
        <a href="{{ url_for('workouts') }}">Workouts</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</nav>

{% endif %}

<div class="container">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
